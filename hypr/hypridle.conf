# nullgrid idle: lock with the ctOS locker, then power the monitors down.
# ponytail: no dim stage. brightnessctl can't drive DP monitors; add a listener with
#           `hyprctl dispatch` dim if a laptop panel ever joins this rig.
general {
    lock_cmd = pgrep -f ctos-lock/greeter.qml || ~/.local/bin/ctos-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 600                                   # 10 min → lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900                                   # 15 min → screens off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}
