# nullgrid bar visualizer: raw ascii to stdout, one line per frame, 16 bars 0..100 separated by ';'
[general]
bars = 16
framerate = 30
autosens = 1
[input]
method = pulse          # auto-resolves to the default sink monitor; "pipewire" grabs the mic instead
source = auto
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
[smoothing]
noise_reduction = 60
